<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ARA Financial & Investment Advisory — Investment Alchemy from Medan.">
    <title>ARA — Financial & Investment Advisory</title>

    <!-- Preload CSS utama untuk mencegah Render-Blocking -->
    <link rel="preload" href="css/01-base.css" as="style">
    
    <!-- Pertimbangkan untuk menggabungkan 4 file CSS ini menjadi 1 file (style.min.css) di tahap produksi -->
    <link rel="stylesheet" href="css/01-base.css">
    <link rel="stylesheet" href="css/02-motion.css">
    <link rel="stylesheet" href="css/03-responsive.css">
    <link rel="stylesheet" href="css/04-performance.css">
</head>
<body class="ara-theme-elegant">

    <!-- Layer background dipisahkan agar composite layer pada browser lebih ringan -->
    <div class="alchemist-lab" aria-hidden="true">
        
        <div class="formula-container">
            <span class="chemical-formula">Fe + C → <b>STEEL</b> · Au · Cu · Ni · Li</span>
            <span class="chemical-formula">C₆H₁₂O₆ → ENERGY · Si · Al · Zn</span>
            <span class="chemical-formula">ORE → PROCESS → VALUE → <b>RETURN</b></span>
            <span class="chemical-formula">RISK + DISCIPLINE + TIME → <b>COMPOUNDING</b></span>
        </div>

        <!-- Inline style top/left dihapus. Gunakan CSS class dengan property 'transform' -->
        <div class="particles-layer">
            <i class="ore-particle pos-1"></i>
            <i class="ore-particle pos-2"></i>
            <i class="ore-particle pos-3"></i>
            <i class="ore-particle pos-4"></i>
            <i class="ore-particle pos-5"></i>
        </div>

        <div class="sparks-layer">
            <div class="ara-spark gold pos-6"></div>
            <div class="ara-spark teal pos-7"></div>
            <div class="ara-spark rose pos-8"></div>
            <div class="ara-spark blue pos-9"></div>
            <div class="ara-spark gold pos-10"></div>
        </div>
    </div>

    <header class="site-header">
        <a class="brand" href="#top" aria-label="ARA Financial & Investment Advisory">
            <!-- Gambar Base64 diganti dengan pemanggilan file eksternal (disarankan format SVG) -->
            <img src="assets/ara-logo.svg" alt="ARA Logo" width="180" height="auto" class="logo-elegant">
        </a>
    </header>

</body>
</html>
